<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 58" width="160" height="58" role="img" aria-label="Pustaka">
  <defs>
    <!-- Brand gradient: blue -> violet -->
    <linearGradient id="pkBg" x1="6" y1="7" x2="48" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Top gloss: lit from above, gives the tile depth -->
    <linearGradient id="pkGloss" x1="27" y1="6" x2="27" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="pkShadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.8" flood-color="#1E1B4B" flood-opacity=".38"/>
    </filter>

    <filter id="pkMarkShadow" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#1E1B4B" flood-opacity=".30"/>
    </filter>
  </defs>

  <!-- Icon tile -->
  <rect x="4" y="6" width="46" height="46" rx="13.5" fill="url(#pkBg)" filter="url(#pkShadow)"/>
  <rect x="4" y="6" width="46" height="46" rx="13.5" fill="url(#pkGloss)"/>
  <rect x="4.7" y="6.7" width="44.6" height="44.6" rx="12.8"
        fill="none" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="1"/>

  <!-- Abstract "P": spine = stem, page = bowl -->
  <path d="M19.5 38V20h6.5a8.5 8.5 0 0 1 0 17h-6.5"
        fill="none" stroke="#FFFFFF" stroke-width="7.4"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#pkMarkShadow)"/>

  <!-- Wordmark -->
  <text x="60" y="38.5"
        font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="-0.6"
        fill="#1F2937">Pustaka</text>
</svg>